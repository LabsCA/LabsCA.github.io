<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>App redes</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#8F4B85">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="App redes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="iconos/icono.svg">
<link rel="icon" type="image/png" sizes="32x32" href="iconos/favicon-32.png">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amaranth:wght@400;700&family=Amatic+SC:wght@700&family=Rammetto+One&display=swap" rel="stylesheet">
<style>
  :root {
    --purpura: #8F4B85;
    --malva: #D99CD2;
    --menta: #C3EAC5;
    --lima: #E0ECBA;
    --olivo: #A8AB67;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--purpura);
  }
  /* La app ocupa toda la pantalla, respetando la muesca del celular */
  #app {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    left: 0; right: 0;
    bottom: 0;
    width: 100%;
    height: calc(100dvh - env(safe-area-inset-top, 0px));
    border: 0;
    background: #fff;
    opacity: 0;
    transition: opacity .35s ease;
  }
  #app.lista { opacity: 1; }

  /* Pantalla de carga */
  #carga {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px;
    padding: 24px;
    background: var(--purpura);
    color: var(--lima);
    font-family: 'Amaranth', system-ui, sans-serif;
    text-align: center;
    transition: opacity .35s ease;
    z-index: 2;
  }
  #carga.oculta { opacity: 0; pointer-events: none; }
  #carga img { width: 112px; height: 112px; }
  #carga h1 {
    margin: 0;
    font-family: 'Rammetto One', 'Amaranth', sans-serif;
    font-weight: 400;
    font-size: 30px;
    color: var(--lima);
  }
  #estado {
    margin: 0;
    font-family: 'Amatic SC', 'Amaranth', sans-serif;
    font-size: 24px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--malva);
  }
  .puntos { display: flex; gap: 8px; }
  .puntos span {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--menta);
    animation: brinco 1.1s infinite ease-in-out;
  }
  .puntos span:nth-child(2) { background: var(--malva); animation-delay: .15s; }
  .puntos span:nth-child(3) { background: var(--lima); animation-delay: .3s; }
  @keyframes brinco {
    0%, 80%, 100% { transform: translateY(0); opacity: .6; }
    40% { transform: translateY(-8px); opacity: 1; }
  }
  #ayuda {
    display: none;
    max-width: 320px;
    font-size: 16px;
    line-height: 1.4;
    color: var(--lima);
  }
  #ayuda a {
    display: inline-block;
    margin-top: 12px;
    padding: 10px 18px;
    border-radius: 999px;
    background: var(--malva);
    color: #2B2B2B;
    font-weight: 700;
    text-decoration: none;
  }
</style>
</head>
<body>

<div id="carga">
  <img src="iconos/icono.svg" alt="">
  <h1>App redes</h1>
  <div class="puntos"><span></span><span></span><span></span></div>
  <p id="estado">Cargando</p>
  <div id="ayuda"></div>
</div>

<iframe id="app" title="App redes"
  allow="clipboard-read; clipboard-write; fullscreen; camera; microphone; web-share"
  referrerpolicy="strict-origin-when-cross-origin"></iframe>

<script>
(function () {
  // ---------------------------------------------------------------
  // URL de la app.
  // Por defecto se toma de la página principal (labsca.github.io/index.html),
  // la misma que usan los enlaces cortos. Así, si algún día cambia la
  // implementación, solo se edita un archivo.
  // Si prefieres fijarla aquí, pega la URL que termina en /exec entre las comillas.
  // ---------------------------------------------------------------
  var APP_URL_FIJA = '';

  var PATRON = /https:\/\/script\.google\.com\/(?:a\/[^\/"']+\/)?macros\/s\/[A-Za-z0-9_-]+\/exec/;
  var CODIGO = /^[ABCDEFGHJKMNPQRSTUVWXYZ23456789]{6,40}$/;

  var marco = document.getElementById('app');
  var carga = document.getElementById('carga');
  var estado = document.getElementById('estado');
  var ayuda = document.getElementById('ayuda');

  function mostrarAyuda(html) {
    ayuda.innerHTML = html;
    ayuda.style.display = 'block';
  }

  function obtenerUrl() {
    if (PATRON.test(APP_URL_FIJA)) return Promise.resolve(APP_URL_FIJA);
    // La página principal (enlaces cortos) vive en la raíz de labsca.github.io, una carpeta arriba de /appredes/
    return fetch('../index.html', { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (txt) {
        var m = txt.match(PATRON);
        if (!m) throw new Error('sin url');
        return m[0];
      });
  }

  function abrir(url) {
    // Un enlace corto también puede abrirse dentro del envoltorio: /appredes/#CODIGO
    var codigo = decodeURIComponent((location.hash || '').slice(1)).trim().toUpperCase();
    // w=1 avisa a la app que está dentro del envoltorio instalado (v3.9.1): los enlaces no deben sacar de él
    var destino = CODIGO.test(codigo)
      ? url + '?r=' + encodeURIComponent(codigo) + '&w=1'
      : url + '?w=1';

    var tiempo = setTimeout(function () {
      estado.textContent = 'Sigue cargando';
      mostrarAyuda('Si la app no aparece, ábrela directamente:<br><a href="' + destino + '" target="_blank" rel="noopener">Abrir App redes</a>');
    }, 15000);

    marco.addEventListener('load', function () {
      clearTimeout(tiempo);
      marco.classList.add('lista');
      carga.classList.add('oculta');
      setTimeout(function () { carga.style.display = 'none'; }, 400);
    }, { once: true });

    marco.src = destino;
  }

  obtenerUrl().then(abrir).catch(function () {
    estado.textContent = 'Falta la dirección de la app';
    mostrarAyuda('No encontré la URL de Apps Script. Pégala en <b>APP_URL_FIJA</b> dentro de <b>appredes/index.html</b>.');
  });

  // v3.9.1: la app no puede recargar esta página desde dentro (es de otro origen); le pide al envoltorio que lo haga.
  // Solo se acepta el mensaje exacto y de páginas de Google (donde corre la app).
  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || d.appredes !== 'recargar') return;
    if (!/^https:\/\/([a-z0-9-]+\.)*(googleusercontent|google)\.com$/i.test(ev.origin)) return;
    location.reload();
  }, false);

  // Registro del service worker (permite instalarla como app en Android)
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
